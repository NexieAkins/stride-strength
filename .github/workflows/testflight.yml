name: TestFlight upload
on:
  push:
    branches: [native/store-launch]
    paths: ['.github/workflows/testflight.yml', 'mobile/scripts/sign-ios.sh', 'mobile/scripts/prepare-signing.py', 'mobile/ios/App/App/SceneDelegate.swift', 'v5-ui.js', 'run-log.js', 'mobile/scripts/layout-qa.cjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select supported Apple SDK
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: npm run sync
        working-directory: mobile
      - run: brew install xcodegen
      - name: Check phone layout with WebKit
        run: |
          npx playwright install webkit
          node mobile/scripts/layout-qa.cjs
      - name: Sign and upload to TestFlight
        run: bash mobile/scripts/sign-ios.sh
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_IOS_PROFILE_BASE64: ${{ secrets.APPLE_IOS_PROFILE_BASE64 }}
          APPLE_WATCH_PROFILE_BASE64: ${{ secrets.APPLE_WATCH_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      - name: Remove signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/stride-signing/build.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/stride-signing"
