name: App
options:
  bundleIdPrefix: com.strideandstrength
packages:
  CapApp-SPM:
    path: CapApp-SPM
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  App:
    type: application
    platform: iOS
    deploymentTarget: '15.0'
    sources:
      - path: App
        excludes: [public, capacitor.config.json, config.xml]
      - path: App/public
        type: folder
        buildPhase: resources
      - path: App/capacitor.config.json
        buildPhase: resources
      - path: App/config.xml
        buildPhase: resources
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strideandstrength.app
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_CFBundleDisplayName: Stride & Strength
    dependencies:
      - package: CapApp-SPM
      - target: StrideWatch
        embed: true
  StrideWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - path: ../../watch
    info:
      path: ../../watch/Info.plist
      properties:
        CFBundleDisplayName: Stride & Strength
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.strideandstrength.app
        NSHealthShareUsageDescription: Read heart rate and running distance during the workout you start.
        NSHealthUpdateUsageDescription: Save the running workouts you finish to Apple Health.
        WKBackgroundModes: [workout-processing]
    entitlements:
      path: ../../watch/StrideWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strideandstrength.app.watchkitapp
        SDKROOT: watchos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  App:
    build:
      targets:
        App: all
